services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: identity_db
      MYSQL_USER: identity
      MYSQL_PASSWORD: "${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - identity_mysql_data:/var/lib/mysql
      - ../../migrations/identity/001_create_users.sql:/docker-entrypoint-initdb.d/001_create_users.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1 --user=root
          --password="$${MYSQL_ROOT_PASSWORD}" identity_db
          --execute="SELECT 1 FROM users LIMIT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  identity:
    build:
      context: ../..
      dockerfile: build/docker/identity.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      IDENTITY_MYSQL_DSN: "identity:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}@tcp(mysql:3306)/identity_db?charset=utf8mb4&parseTime=True&loc=UTC"
      IDENTITY_HTTP_ADDR: ":8081"
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  identity_mysql_data:
